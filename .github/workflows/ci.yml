name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Syntax
        run: |
          set -e
          while IFS= read -r f; do
            node --check "$f"
          done < <(find tools src -type f \( -name '*.js' -o -name '*.mjs' \) -print)
      - name: Frontend function integrity
        run: node tools/check-funciones.mjs
      - name: Pure rules tests
        run: node tools/local-tests/run_tests.mjs
